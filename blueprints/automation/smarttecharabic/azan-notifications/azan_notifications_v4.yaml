    speaker_1_section:
      name: Speaker
      description: Choose a speaker and its volume for each prayer. 0 keeps it silent for that prayer.
      icon: mdi:speaker
      collapsed: false
      input:

        speaker_1:
          name: Speaker
          default: ""
          selector:
            entity:
              filter:
