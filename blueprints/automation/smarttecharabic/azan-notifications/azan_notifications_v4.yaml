blueprint:
  name: Azan Notifications - V4
  description: |
    **Plays the Athan on your speakers at every prayer time, each speaker at its own volume.**

    Choose the prayer times, a voice for each prayer, then your speakers with each one's volume per prayer.
    Reminders and phone notifications are optional. To test it, open the ⋮ menu and choose Run actions (plays the Dhuhr voice at Dhuhr volumes).

    [How to use it](https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/README.md) · [الشرح بالعربي](https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/README.md#arabic)

    By [Shady Nafie, Smart Tech Arabic](https://smarttecharabic.com)

  domain: automation
  source_url: https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/azan_notifications_v4.yaml

  input:
    times_section:
      name: Prayer times
      description: Choose each prayer's own time, such as Fajr Prayer. Do not choose Iqama.
      icon: mdi:mosque-outline
      input:
        fajr_sensor:
          name: 🌅 Fajr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        dhuhr_sensor:
          name: ☀️ Dhuhr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        asr_sensor:
          name: 🌤️ Asr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        maghrib_sensor:
          name: 🌆 Maghrib
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        isha_sensor:
          name: 🌙 Isha
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp

    voices_section:
      name: Athan voice
      description: "Choose a voice for each prayer. [Listen to the voices](https://shadynafie.github.io/home-assistant-blueprints/azan-voices.html)"
      icon: mdi:account-voice
      input:
        fajr_voice:
          name: 🌅 Fajr
          description: Fajr has its own Athan, so only Fajr voices are listed.
          default: mishary-alafasy-fajr
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Mishary Alafasy (3:02)"
                  value: "mishary-alafasy-fajr"
                - label: "Mishary Alafasy, Hijaz (3:41)"
                  value: "mishary-alafasy-fajr-hijaz"
                - label: "Ali Ahmed Mulla (3:56)"
                  value: "ali-ahmed-mulla-fajr"
