variables:
  audio_base: https://raw.githubusercontent.com/shadynafie/home-assistant-blueprints/main/blueprints/automation/smarttecharabic/azan-notifications/audio/
  main_sound: !input mp3_file
  main_volume: !input volume_level
  speakers_input: !input media_player_target
  phones_input: !input notify_device
  prayers:
    fajr:
      enabled: !input fajr_enabled
      voice: !input fajr_voice
      volume: !input fajr_volume
      message: !input fajr_message
      title: "🌅 Fajr Prayer Time"
      icon: mdi:weather-sunset-up
      color: "#FFA726"
    dhuhr:
      enabled: !input dhuhr_enabled
      voice: !input dhuhr_voice
      volume: !input dhuhr_volume
      message: !input dhuhr_message
      title: "☀️ Dhuhr Prayer Time"
      icon: mdi:weather-sunny
      color: "#FFD54F"
    asr:
      enabled: !input asr_enabled
      voice: !input asr_voice
      volume: !input asr_volume
      message: !input asr_message
      title: "🌤️ Asr Prayer Time"
      icon: mdi:weather-partly-cloudy
      color: "#FF8A65"
    maghrib:
      enabled: !input maghrib_enabled
      voice: !input maghrib_voice
      volume: !input maghrib_volume
      message: !input maghrib_message
      title: "🌆 Maghrib Prayer Time"
      icon: mdi:weather-sunset
      color: "#FF7043"
    isha:
      enabled: !input isha_enabled
      voice: !input isha_voice
      volume: !input isha_volume
      message: !input isha_message
      title: "🌙 Isha Prayer Time"
      icon: mdi:weather-night
      color: "#5C6BC0"
  prayer: "{{ prayers[trigger.id] }}"
  sound: "{{ main_sound if prayer.voice == 'default' else prayer.voice }}"
  # Older versions stored a full link here; a voice name becomes a link to this repository.
  audio_url: >-
    {% if sound == 'none' or not sound %}{% elif sound.startswith('http') %}{{ sound }}{% else %}{{ audio_base ~ sound ~ '.mp3' }}{% endif %}
  volume: "{{ prayer.volume if prayer.volume | float(0) > 0 else main_volume }}"
  speakers: "{{ [speakers_input] if speakers_input is string else speakers_input }}"
  phones: "{{ [phones_input] if phones_input is string else phones_input }}"
  echo_speakers: "{{ speakers | select('in', integration_entities('alexa_media')) | list }}"
  other_speakers: "{{ speakers | reject('in', integration_entities('alexa_media')) | list }}"

trigger:
  - platform: time
    at: !input fajr_sensor
    id: fajr
  - platform: time
    at: !input dhuhr_sensor
    id: dhuhr
  - platform: time
    at: !input asr_sensor
    id: asr
  - platform: time
    at: !input maghrib_sensor
    id: maghrib
  - platform: time
    at: !input isha_sensor
    id: isha

condition:
  - condition: template
    value_template: "{{ prayers[trigger.id].enabled }}"

action:
  - parallel:
      - repeat:
          for_each: "{{ phones }}"
          sequence:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              continue_on_error: true
              data:
                title: "{{ prayer.title }}"
                message: "{{ prayer.message }}"
                data:
                  notification_icon: "{{ prayer.icon }}"
                  color: "{{ prayer.color }}"
                  channel: prayer_notifications
                  importance: high
                  persistent: true
                  sticky: true
                  timeout: 0
                  actions:
                    - action: MARK_PRAYED
                      title: Mark as Prayed
                      icon: sfsymbols:checkmark.circle
                    - action: SNOOZE_PRAYER
                      title: Remind me in 5 min
                      icon: sfsymbols:clock
      - if: "{{ audio_url != '' and echo_speakers | count > 0 }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ echo_speakers }}"
            data:
              volume_level: "{{ volume }}"
          - action: notify.alexa_media
            data:
              message: '<audio src="{{ audio_url }}"/>'
              target: "{{ echo_speakers }}"
              data:
                type: tts
      - if: "{{ audio_url != '' and other_speakers | count > 0 }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ other_speakers }}"
            data:
              volume_level: "{{ volume }}"
          - action: media_player.play_media
            target:
              entity_id: "{{ other_speakers }}"
            data:
              media_content_type: music
              media_content_id: "{{ audio_url }}"

mode: parallel
max_exceeded: silent
