                  value: none
        fajr_volume:
          name: Volume
          description: 0 keeps your main volume.
          default: 0
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
              mode: slider
        fajr_message:
          name: Phone message
          default: Time for Fajr prayer – حان الآن موعد صلاة الفجر
