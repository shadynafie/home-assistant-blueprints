blueprint:
  name: Azan Notifications - V3.5
  description: |
    **Plays the Athan on your speakers at every prayer time.**

    Fill in the first two panels and save. Everything else is optional. To test it, open the ⋮ menu and choose Run actions.

    [How to use it](https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/README.md) · [الشرح بالعربي](https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/README.md#arabic)

    By [Shady Nafie, Smart Tech Arabic](https://smarttecharabic.com)

  domain: automation
  source_url: https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/azan_notifications.yaml

  input:
    prayer_sensors_section:
      name: Prayer times
      description: Choose each prayer's own time, such as Fajr Prayer. Do not choose Iqama.
      icon: mdi:mosque-outline
      input:
        fajr_sensor:
          name: 🌅 Fajr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        dhuhr_sensor:
          name: ☀️ Dhuhr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        asr_sensor:
          name: 🌤️ Asr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        maghrib_sensor:
          name: 🌆 Maghrib
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        isha_sensor:
          name: 🌙 Isha
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp

    sound_section:
      name: Speakers and sound
      description: Choose your speakers, a voice and a volume.
      icon: mdi:volume-high
      collapsed: false
      input:
        media_player_target:
          name: Speakers
          description: Leave empty if you only want phone notifications.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        mp3_file:
          name: Athan voice
          description: "[Listen to the voices](https://shadynafie.github.io/home-assistant-blueprints/azan-voices.html)"
          default: mishary-alafasy
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Mishary Alafasy (4:00)"
                  value: mishary-alafasy
                - label: "Abdul Basit (3:19)"
                  value: abdul-basit
                - label: "Abdul Basit 2 (3:03)"
                  value: abdul-basit-2
                - label: "Mahmoud Al-Husary (2:06)"
                  value: mahmoud-al-husary
                - label: "Mahmoud Ali Al-Banna (2:45)"
                  value: mahmoud-ali-al-banna
                - label: "Mustafa Ismail (2:00)"
                  value: mustafa-ismail
                - label: "Ahmad Nuaina (3:29)"
                  value: ahmad-nuaina
                - label: "Ragheb Ghalwash (3:05)"
                  value: ragheb-ghalwash
                - label: "Al-Shahat Anwar (3:18)"
                  value: al-shahat-anwar
                - label: "Abdel Fattah Al-Tarouti (2:45)"
                  value: abdel-fattah-al-tarouti
                - label: "Abdulaziz Harbi (2:36)"
                  value: abdulaziz-harbi
