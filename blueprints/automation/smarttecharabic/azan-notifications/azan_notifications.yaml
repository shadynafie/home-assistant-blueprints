        volume_level:
          name: Volume
          default: 0.3
          selector:
            number:
              min: 0.05
              max: 1
              step: 0.05
              mode: slider
        echo_volume:
          name: Echo volume
          description: 0 keeps the volume above.
          default: 0
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
              mode: slider
        reminder_tts:
          name: Voice for spoken reminders
          description: Needed for HomePod, Google Cast and Sonos. Not needed for Echo.
          default: ""
          selector:
            entity:
              filter:
                - domain: tts

    notify_target:
      name: "Optional: Phones"
      description: Choose the phones to notify.
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_device:
          name: Phones
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

    fajr_section:
      name: "Optional: 🌅 Fajr"
      description: Changes here apply to Fajr only.
      icon: mdi:tune
      collapsed: true
      input:
        fajr_enabled:
          name: Use this prayer
          default: true
          selector:
            boolean: {}
        fajr_voice:
          name: Athan voice
          default: mishary-alafasy-fajr
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Mishary Alafasy (3:02)"
                  value: mishary-alafasy-fajr
                - label: "Mishary Alafasy, Hijaz (3:41)"
                  value: mishary-alafasy-fajr-hijaz
                - label: "Ali Ahmed Mulla (3:56)"
                  value: ali-ahmed-mulla-fajr
                - label: "Ahmed Afifi (3:35)"
                  value: ahmed-afifi-fajr
                - label: "Hassan Mustafa (2:31)"
                  value: hassan-mustafa-fajr
                - label: "Hamad Deghreri (3:14)"
