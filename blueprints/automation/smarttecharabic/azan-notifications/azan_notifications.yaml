trigger_variables:
  reminders:
    fajr:
      sensor: !input fajr_sensor
      active: !input fajr_reminder
      message: !input fajr_reminder_message
    dhuhr:
      sensor: !input dhuhr_sensor
      active: !input dhuhr_reminder
      message: !input dhuhr_reminder_message
    asr:
      sensor: !input asr_sensor
      active: !input asr_reminder
      message: !input asr_reminder_message
    maghrib:
      sensor: !input maghrib_sensor
      active: !input maghrib_reminder
      message: !input maghrib_reminder_message
    isha:
      sensor: !input isha_sensor
      active: !input isha_reminder
      message: !input isha_reminder_message

variables:
  audio_base: https://raw.githubusercontent.com/shadynafie/home-assistant-blueprints/main/blueprints/automation/smarttecharabic/azan-notifications/audio/
  main_sound: !input mp3_file
  main_volume: !input volume_level
  echo_main_volume: !input echo_volume
  speakers_input: !input media_player_target
  phones_input: !input notify_device
  tts_engine: !input reminder_tts
  prayers:
    fajr:
      enabled: !input fajr_enabled
      voice: !input fajr_voice
      volume: !input fajr_volume
      message: !input fajr_message
      reminder: !input fajr_reminder
      reminder_message: !input fajr_reminder_message
      reminder_phone: !input fajr_reminder_phone
      title: "🌅 Fajr Prayer Time"
      icon: mdi:weather-sunset-up
      color: "#FFA726"
    dhuhr:
      enabled: !input dhuhr_enabled
      voice: !input dhuhr_voice
      volume: !input dhuhr_volume
      message: !input dhuhr_message
      reminder: !input dhuhr_reminder
      reminder_message: !input dhuhr_reminder_message
      reminder_phone: !input dhuhr_reminder_phone
      title: "☀️ Dhuhr Prayer Time"
      icon: mdi:weather-sunny
      color: "#FFD54F"
    asr:
      enabled: !input asr_enabled
      voice: !input asr_voice
      volume: !input asr_volume
      message: !input asr_message
      reminder: !input asr_reminder
      reminder_message: !input asr_reminder_message
      reminder_phone: !input asr_reminder_phone
      title: "🌤️ Asr Prayer Time"
      icon: mdi:weather-partly-cloudy
      color: "#FF8A65"
    maghrib:
      enabled: !input maghrib_enabled
      voice: !input maghrib_voice
      volume: !input maghrib_volume
      message: !input maghrib_message
      reminder: !input maghrib_reminder
      reminder_message: !input maghrib_reminder_message
      reminder_phone: !input maghrib_reminder_phone
      title: "🌆 Maghrib Prayer Time"
      icon: mdi:weather-sunset
      color: "#FF7043"
    isha:
      enabled: !input isha_enabled
      voice: !input isha_voice
      volume: !input isha_volume
      message: !input isha_message
      reminder: !input isha_reminder
      reminder_message: !input isha_reminder_message
      reminder_phone: !input isha_reminder_phone
      title: "🌙 Isha Prayer Time"
      icon: mdi:weather-night
      color: "#5C6BC0"
    # Pressing Run has no prayer time, so it plays the main voice on the speakers as a test.
    test:
      enabled: true
      voice: default
      volume: 0
      reminder: false
      reminder_message: ""
      reminder_phone: ""
  trigger_name: "{{ trigger.id if trigger is defined and trigger.id is defined else 'test' }}"
  is_reminder: "{{ trigger_name.endswith('_reminder') }}"
  prayer_id: "{{ trigger_name | replace('_reminder', '') }}"
  prayer: "{{ prayers[prayer_id] }}"
  # Fajr has its own Athan, so it never falls back to the main voice.
  sound: "{{ 'mishary-alafasy-fajr' if prayer_id == 'fajr' and prayer.voice == 'default' else (main_sound if prayer.voice == 'default' else prayer.voice) }}"
  # Older versions stored a full link here; a voice name becomes a link to this repository.
  audio_url: >-
    {% if sound == 'none' or not sound %}{% elif sound.startswith('http') %}{{ sound }}{% else %}{{ audio_base ~ sound ~ '.mp3' }}{% endif %}
  volume: "{{ prayer.volume if prayer.volume | float(0) > 0 else main_volume }}"
  echo_level: "{{ prayer.volume if prayer.volume | float(0) > 0 else (echo_main_volume if echo_main_volume | float(0) > 0 else main_volume) }}"
  speakers: "{{ [speakers_input] if speakers_input is string else speakers_input }}"
  phones: "{{ [] if prayer_id == 'test' else ([phones_input] if phones_input is string else phones_input) }}"
  echo_speakers: "{{ speakers | select('in', integration_entities('alexa_media')) | list }}"
  other_speakers: "{{ speakers | reject('in', integration_entities('alexa_media')) | list }}"
  # Music Assistant plays the Athan as an announcement: its own volume, then each speaker's volume and music come back.
  ma_speakers: "{{ other_speakers | select('in', integration_entities('music_assistant')) | list }}"
  plain_speakers: "{{ other_speakers | reject('in', integration_entities('music_assistant')) | list }}"
  # Run actions has no prayer time, so it speaks the first reminder that is switched on.
  reminder_text: >-
    {% set on = prayers.values() | selectattr('enabled') | selectattr('reminder') | list %}{% set p = prayer if is_reminder else (on[0] if on and prayer_id == 'test' else none) %}{{ p.reminder_message if p else '' }}

trigger:
  - platform: time
    at: !input fajr_sensor
    id: fajr
  - platform: template
    value_template: >-
      {% set r = reminders.fajr %}{% set n = r.message | regex_findall('[0-9٠-٩]+') %}{% set t = states(r.sensor) | as_datetime(none) %}{{ r.active and t is not none and t - timedelta(minutes=(n[0] | int if n else 15)) <= now() < t }}
    id: fajr_reminder
  - platform: time
    at: !input dhuhr_sensor
    id: dhuhr
  - platform: template
    value_template: >-
      {% set r = reminders.dhuhr %}{% set n = r.message | regex_findall('[0-9٠-٩]+') %}{% set t = states(r.sensor) | as_datetime(none) %}{{ r.active and t is not none and t - timedelta(minutes=(n[0] | int if n else 15)) <= now() < t }}
    id: dhuhr_reminder
  - platform: time
    at: !input asr_sensor
    id: asr
  - platform: template
    value_template: >-
      {% set r = reminders.asr %}{% set n = r.message | regex_findall('[0-9٠-٩]+') %}{% set t = states(r.sensor) | as_datetime(none) %}{{ r.active and t is not none and t - timedelta(minutes=(n[0] | int if n else 15)) <= now() < t }}
    id: asr_reminder
  - platform: time
    at: !input maghrib_sensor
    id: maghrib
  - platform: template
    value_template: >-
      {% set r = reminders.maghrib %}{% set n = r.message | regex_findall('[0-9٠-٩]+') %}{% set t = states(r.sensor) | as_datetime(none) %}{{ r.active and t is not none and t - timedelta(minutes=(n[0] | int if n else 15)) <= now() < t }}
    id: maghrib_reminder
  - platform: time
    at: !input isha_sensor
    id: isha
  - platform: template
    value_template: >-
      {% set r = reminders.isha %}{% set n = r.message | regex_findall('[0-9٠-٩]+') %}{% set t = states(r.sensor) | as_datetime(none) %}{{ r.active and t is not none and t - timedelta(minutes=(n[0] | int if n else 15)) <= now() < t }}
    id: isha_reminder

condition:
  - condition: template
    value_template: "{{ prayer.enabled }}"

action:
  - if: "{{ reminder_text != '' }}"
    then:
      - parallel:
          - repeat:
              for_each: "{{ phones if prayer.reminder_phone else [] }}"
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  continue_on_error: true
                  data:
                    title: "{{ prayer.title }}"
                    message: "{{ prayer.reminder_phone }}"
          - if: "{{ echo_speakers | count > 0 }}"
            then:
              - action: notify.alexa_media
                continue_on_error: true
                data:
                  message: "{{ reminder_text }}"
                  target: "{{ echo_speakers }}"
                  data:
                    type: tts
          - if: "{{ tts_engine != '' and other_speakers | count > 0 }}"
            then:
              - action: tts.speak
                continue_on_error: true
                target:
                  entity_id: "{{ tts_engine }}"
                data:
                  media_player_entity_id: "{{ other_speakers }}"
                  message: "{{ reminder_text }}"
      # On Run actions, give the sample reminder time to finish before the Athan.
      - if: "{{ not is_reminder }}"
        then:
          - delay: "00:00:06"
  - if: "{{ is_reminder }}"
    then:
      - stop: Reminder finished
  - parallel:
      - repeat:
          for_each: "{{ phones }}"
          sequence:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              continue_on_error: true
              data:
                title: "{{ prayer.title }}"
                message: "{{ prayer.message }}"
                data:
                  notification_icon: "{{ prayer.icon }}"
                  color: "{{ prayer.color }}"
                  channel: prayer_notifications
                  importance: high
                  persistent: true
                  sticky: true
                  timeout: 0
                  actions:
                    - action: MARK_PRAYED
                      title: Mark as Prayed
                      icon: sfsymbols:checkmark.circle
                    - action: SNOOZE_PRAYER
                      title: Remind me in 5 min
                      icon: sfsymbols:clock
      - if: "{{ audio_url != '' and echo_speakers | count > 0 }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ echo_speakers }}"
            data:
              volume_level: "{{ echo_level }}"
          - action: notify.alexa_media
            data:
              message: '<audio src="{{ audio_url }}"/>'
              target: "{{ echo_speakers }}"
              data:
                type: tts
      - if: "{{ audio_url != '' and ma_speakers | count > 0 }}"
        then:
          - action: music_assistant.play_announcement
            target:
              entity_id: "{{ ma_speakers }}"
            data:
              url: "{{ audio_url }}"
              use_pre_announce: false
              announce_volume: "{{ (volume | float(0.3) * 100) | round(0) | int }}"
      - if: "{{ audio_url != '' and plain_speakers | count > 0 }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ plain_speakers }}"
            data:
              volume_level: "{{ volume }}"
          - action: media_player.play_media
            target:
              entity_id: "{{ plain_speakers }}"
            data:
              media_content_type: music
              media_content_id: "{{ audio_url }}"

mode: parallel
max_exceeded: silent
