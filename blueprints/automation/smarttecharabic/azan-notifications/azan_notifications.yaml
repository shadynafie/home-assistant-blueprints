                  value: momen-tarek-salim-fajr
                - label: "Mohamed Naji (2:16)"
                  value: mohamed-naji-fajr
                - label: "Ahmad Nawaf Al-Mijlad (3:38)"
                  value: ahmad-nawaf-al-mijlad-fajr
