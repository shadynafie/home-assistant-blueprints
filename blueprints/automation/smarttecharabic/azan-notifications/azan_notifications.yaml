blueprint:
  name: Azan Notifications - V3.1
  description: |
    **Plays the Athan on your speakers at every prayer time.**

    Fill in the first two panels and save. Everything else is optional.

    [How to use it](https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/README.md) · [الشرح بالعربي](https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/README.md#arabic)

    By [Shady Nafie, Smart Tech Arabic](https://smarttecharabic.com)

  domain: automation
  source_url: https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/azan_notifications.yaml

  input:
    prayer_sensors_section:
      name: Prayer times
      description: Choose your five prayer times.
      icon: mdi:mosque-outline
      input:
        fajr_sensor:
          name: 🌅 Fajr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        dhuhr_sensor:
          name: ☀️ Dhuhr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        asr_sensor:
          name: 🌤️ Asr
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        maghrib_sensor:
          name: 🌆 Maghrib
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        isha_sensor:
          name: 🌙 Isha
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp

    sound_section:
      name: Speakers and sound
      description: Choose your speakers, a voice and a volume.
      icon: mdi:volume-high
      collapsed: false
      input:
        media_player_target:
          name: Speakers
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        mp3_file:
          name: Athan voice
          description: "[Listen to the voices](https://shadynafie.github.io/home-assistant-blueprints/azan-voices.html)"
          default: mishary-alafasy
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Abdul Basit (3:19)"
                  value: abdul-basit
                - label: "Ahmad Nuaina (3:29)"
                  value: ahmad-nuaina
                - label: "Hamad Deghreri (2:41)"
                  value: hamad-deghreri
                - label: "Hamdan Almalki (4:25)"
                  value: hamdan-almalki
                - label: "Ibrahim Al-Arkani (3:59)"
                  value: ibrahim-al-arkani
                - label: "Majed Al-Hamathani (3:45)"
                  value: majed-al-hamathani
                - label: "Makkah (3:20)"
                  value: makkah
                - label: "Malek Chebae (Fajr) (4:10)"
                  value: malek-chebae-fajr
                - label: "Mansoor Az-Zahrani (3:10)"
                  value: mansoor-az-zahrani
                - label: "Mishary Alafasy (4:00)"
                  value: mishary-alafasy
                - label: "Mohammad Al-Minshawi (4:05)"
                  value: mohammad-al-minshawi
                - label: "Mohammad Refaat (3:22)"
                  value: mohammad-refaat
                - label: "Nasser Al-Qatami (2:19)"
                  value: nasser-al-qatami
                - label: "Suhaib Khatba (3:03)"
                  value: suhaib-khatba
        volume_level:
          name: Volume
          default: 0.3
          selector:
            number:
              min: 0.05
              max: 1
              step: 0.05
              mode: slider
        echo_volume:
          name: Echo volume
          description: 0 keeps the volume above.
          default: 0
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
              mode: slider

    notify_target:
      name: "Optional: Phones"
      description: Choose the phones to notify.
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_device:
          name: Phones
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

    fajr_section:
      name: "Optional: 🌅 Fajr"
      description: Changes here apply to Fajr only.
      icon: mdi:tune
      collapsed: true
      input:
        fajr_enabled:
          name: Use this prayer
          default: true
          selector:
            boolean: {}
        fajr_voice:
          name: Athan voice
          default: malek-chebae-fajr
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Same as your main voice"
                  value: default
                - label: "No sound (phone only)"
                  value: none
                - label: "Abdul Basit (3:19)"
                  value: abdul-basit
                - label: "Ahmad Nuaina (3:29)"
                  value: ahmad-nuaina
                - label: "Hamad Deghreri (2:41)"
                  value: hamad-deghreri
                - label: "Hamdan Almalki (4:25)"
                  value: hamdan-almalki
