blueprint:
  name: Azan Notifications - V3.0
  description: |
    **Azan Notifications + Athan on your speakers - V3.0**
    **By [Shady Nafie — Smart Tech Arabic](https://smarttecharabic.com)**

    Plays the Athan at each prayer time and can notify your phones.

    **Setup:** pick your speakers, a voice and your five prayer time sensors, then save.
    Everything else is optional, including a different voice or volume for each prayer.

    **Works with:** Amazon Echo (through Alexa Media Player), HomePod, Google Cast and Sonos.
    Echo speakers are detected automatically. You can mix speaker types.

    **Prayer times:** any timestamp sensors, such as the MAWAQIT or Islamic Prayer Times integrations.

  domain: automation
  source_url: https://github.com/shadynafie/home-assistant-blueprints/blob/main/blueprints/automation/smarttecharabic/azan-notifications/azan_notifications.yaml

  input:
    sound_section:
      name: Speakers and sound
      icon: mdi:volume-high
      collapsed: false
      input:
        media_player_target:
          name: Speakers
          description: Choose one or more speakers.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        mp3_file:
          name: Main Athan sound
          description: Used for every prayer unless you change it below. Pick a voice, or type the https link to your own MP3.
          default: voice-01
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Athan voice 1 (2:13)"
                  value: voice-01
                - label: "Athan voice 2 (3:16)"
                  value: voice-02
                - label: "Athan voice 3 (3:26)"
                  value: voice-03
                - label: "Athan voice 4 (2:08)"
                  value: voice-04
                - label: "Athan voice 5 (1:58)"
                  value: voice-05
                - label: "Athan voice 6 (2:52)"
                  value: voice-06
                - label: "Athan voice 7 (2:00)"
                  value: voice-07
                - label: "Athan voice 8 (3:20)"
                  value: voice-08
                - label: "Athan voice 9 (3:57)"
                  value: voice-09
                - label: "Athan voice 10 (3:31)"
                  value: voice-10
                - label: "Athan voice 11 (2:29)"
                  value: voice-11
                - label: "Athan voice 12 (3:42)"
                  value: voice-12
                - label: "Athan voice 13 (2:39)"
                  value: voice-13
                - label: "Athan voice 14 (3:03)"
                  value: voice-14
                - label: "Athan voice 15 (1:52)"
                  value: voice-15
        volume_level:
          name: Main volume
          default: 0.3
          selector:
            number:
              min: 0.05
              max: 1
              step: 0.05
              mode: slider

    prayer_sensors_section:
      name: Prayer times
      description: Choose the sensors that give each prayer time.
      icon: mdi:mosque-outline
      collapsed: false
      input:
        fajr_sensor:
          name: 🌅 Fajr time
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        dhuhr_sensor:
          name: ☀️ Dhuhr time
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        asr_sensor:
          name: 🌤️ Asr time
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        maghrib_sensor:
          name: 🌆 Maghrib time
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp
        isha_sensor:
          name: 🌙 Isha time
          selector:
            entity:
              filter:
                - domain: [sensor]
                  device_class: timestamp

    notify_target:
      name: Phone notifications (optional)
      icon: mdi:cellphone-message
      collapsed: false
      input:
        notify_device:
          name: Phones
          description: Needs the Home Assistant Companion app. Leave empty for no notifications.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

    fajr_section:
      name: 🌅 Fajr options
      icon: mdi:tune
      collapsed: true
      input:
        fajr_enabled:
          name: Use this prayer
          description: Turn off to skip both the sound and the phone notification.
          default: true
          selector:
            boolean: {}
        fajr_voice:
